<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Project - Listing City Data With DOM</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/cities.js" defer></script>
</head>

<body>

  <h2>Şehir Adı | Ne İle Ünlü | Plaka Kodu</h2>
  <table border="1">
    <thead>
      <tr>
        <th class="title">Şehir</th>
        <th class="title">Ünlü Olduğu</th>
        <th class="title">Plaka</th>
      </tr>
    </thead>
    <tbody id="citiesListFamousForPlateNumber"></tbody>
  </table>

  <h2>Yemekleri İle Ünlü Olan Şehirler</h2>
  <table border="1">
    <thead>
      <tr>
        <th class="title">Şehir</th>
        <th class="title">Ünlü Olduğu Yemek</th>
      </tr>
    </thead>
    <tbody id="citiesFamousForTheirFood"></tbody>
  </table>

  <h2>Tarihi Yerleri İle Ünlü Olan Şehirler</h2>
  <table border="1">
    <thead>
      <tr>
        <th class="title">Şehir</th>
        <th class="title">Ünlü Olduğu Tarihi Yer</th>
      </tr>
    </thead>
    <tbody id="citiesFamousForTheirHistoricPlaces"></tbody>
  </table>

  <h2>Plaka Kodu Tek Sayı Olan Şehirler</h2>
  <table border="1">
    <thead>
      <tr>
        <th class="title">Şehir</th>
        <th class="title">Plaka Kodu</th>
      </tr>
    </thead>
    <tbody id="citiesWithOddNumberedLicensePlates"></tbody>
  </table>

  <h2>Plaka Kodu Çift Sayı Olan Şehirler</h2>
  <table border="1">
    <thead>
      <tr>
        <th class="title">Şehir</th>
        <th class="title">Plaka Kodu</th>
      </tr>
    </thead>
    <tbody id="citiesWithEvenNumberedLicensePlates"></tbody>
  </table>

</body>

</html>
